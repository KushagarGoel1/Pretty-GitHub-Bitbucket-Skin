<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 14px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172b4d;
      background: #fff;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #0052cc;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    /* toggle switch */
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #dfe1e6; border-radius: 22px; transition: .2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 16px; width: 16px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #0052cc; }
    input:checked + .slider::before { transform: translateX(18px); }
    p { font-size: 11px; color: #5e6c84; margin: 10px 0 0; }
  </style>
</head>
<body>
  <h1>Pretty GitHub</h1>
  <div class="row">
    <span>Bitbucket skin</span>
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
  </div>
  <p>Restyles github.com to look like Bitbucket. Reload the tab if a page looks half-styled.</p>
  <script src="popup.js"></script>
</body>
</html>
